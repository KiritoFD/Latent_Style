  <g id="labels" font-size="11px" font-weight="bold">
    <text x="46.0" y="102.0" text-anchor="start" fill="#D8860D">Style branch</text>
    <text x="222.0" y="102.0" text-anchor="start" fill="#3D5A80">Latent trunk</text>
    <text x="46.0" y="502.0" text-anchor="start" fill="#D8860D">Cross-attn detail</text>
    <text x="46.0" y="574.0" text-anchor="start" fill="#4A9B9E">Training objectives</text>
