    <text x="54.0" y="534.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label qbox">$Q$\ncontent</text>
    <rect x="87.99999999999999" y="523.0" width="48.0" height="22.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node kvbox"/>
    <text x="111.99999999999999" y="534.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label kvbox">$K,V$\nstyle</text>
    <rect x="144.0" y="523.0" width="52.0" height="22.0" fill="#F5F5F5" stroke="#999999" stroke-width="1.5" rx="3" class="node soft"/>
    <text x="170.0" y="534.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label soft">$A=softmax$\n$(QK^T)$</text>
    <rect x="204.00000000000003" y="523.0" width="48.0" height="22.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node paint"/>
    <text x="228.00000000000003" y="534.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label paint">$AV$\noutput</text>
    <rect x="16.000000000000007" y="605.0" width="92.0" height="30.0" fill="#D4F5F6" stroke="#4A9B9E" stroke-width="1.5" rx="3" class="node swd"/>
