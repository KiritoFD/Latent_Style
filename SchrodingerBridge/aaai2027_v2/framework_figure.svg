<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="500" viewBox="0 0 540 500">
  <style>
.node { cursor: move; }
.label { cursor: text; pointer-events: none; }
text { user-select: none; }
</style>
  <rect width="100%" height="100%" fill="white"/>
  <g id="nodes">
    <rect x="25.0" y="123.0" width="62.0" height="22.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node sid"/>
    <text x="56.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label sid">style id $s$</text>
    <rect x="25.0" y="167.0" width="62.0" height="26.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node scode"/>
    <text x="56.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label scode">style code\n$w$</text>
    <rect x="25.0" y="219.0" width="62.0" height="26.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node sprior"/>
    <text x="56.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label sprior">style spatial\nprior $M_s^{sp}$</text>
    <rect x="25.0" y="269.0" width="62.0" height="26.0" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node smap"/>
