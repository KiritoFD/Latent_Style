    <rect x="182.0" y="167.0" width="80.0" height="26.0" fill="#E3ECFF" stroke="#3D5A80" stroke-width="1.5" rx="3" class="node lift"/>
    <text x="222.0" y="180.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label lift">lift stem $4→128$ ch</text>
    <rect x="182.0" y="218.0" width="80.0" height="28.0" fill="#E3ECFF" stroke="#3D5A80" stroke-width="1.5" rx="3" class="node hires"/>
