    <rect x="336.0" y="605.0" width="92.0" height="30.0" fill="#D4F5F6" stroke="#4A9B9E" stroke-width="1.5" rx="3" class="node fm"/>
    <text x="382.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label fm">flow matching\nvelocity field</text>
