    <text x="222.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="10px" fill="#000000" class="label down">down $32→16$ ch</text>
    <rect x="172.0" y="324.4" width="100.0" height="31.200000000000003" fill="#FFE5CC" stroke="#D8860D" stroke-width="1.5" rx="3" class="node body"/>
