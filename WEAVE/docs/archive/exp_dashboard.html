  {method:"idt",group:"idt",name:"Ablate43_L03_IDT_MassiveReturn",dataset:"unknown",epoch:60,clip_style:0.6736,clip_s_delta_idt:0.8760,clip_t:0.3342,content_lpips:0.3325,one_minus_lpips:null,eval_type:"full_eval",notes:"IDT ablation"}
];

const METHOD_COLORS = {
  'LANCET/LBM': '#f85149',
  'LANCET/620': '#bc8cff',
  'SaMAM': '#58a6ff',
  'SaMST': '#3fb950',
  'idt': '#d2a8ff'
};

// Build scatter datasets — only points with valid one_minus_lpips (distinct5_512 chart)
const scatterData = DATA.filter(d => d.one_minus_lpips != null).map(d => ({
  x: d.clip_style,
  y: d.one_minus_lpips,
  method: d.method,
  name: d.name,
  epoch: d.epoch,
  dataset: d.dataset,
  clip_s_delta_idt: d.clip_s_delta_idt,
  eval_type: d.eval_type,
  notes: d.notes
}));

const datasets = Object.entries(METHOD_COLORS).map(([method, color]) => ({
  label: method,
  data: scatterData.filter(d => d.method === method),
  backgroundColor: color + 'cc',
  borderColor: color,
  borderWidth: 1.5,
  pointRadius: 6,
  pointHoverRadius: 9,
  pointStyle: 'circle'
}));

// Baselines
const idtFloorPlugin = {
  id: 'idtFloor',
  afterDraw(chart) {
    const ctx = chart.ctx;
    const xAxis = chart.scales.x;
    const yAxis = chart.scales.y;
    const xPos = xAxis.getPixelForValue(0.6399);
    // IDT floor vertical dashed line
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#8b949e';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(xPos, yAxis.top);
    ctx.lineTo(xPos, yAxis.bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#8b949e';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText('IDT floor 0.6399', xPos + 4, yAxis.top + 14);
    // SeeDiem reference point
    const sdX = xAxis.getPixelForValue(0.692);
    const sdY = yAxis.getPixelForValue(1 - 0.4923);
    ctx.beginPath();
    ctx.arc(sdX, sdY, 8, 0, 2 * Math.PI);
    ctx.strokeStyle = '#f0883e';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = '#f0883e';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText('SeeDiem', sdX + 12, sdY + 4);
    ctx.restore();
  }
};

const ctx = document.getElementById('paretoChart').getContext('2d');
new Chart(ctx, {
  type: 'scatter',
  data: { datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: {
        title: { display: true, text: 'CLIP Style', color: '#c9d1d9', font: { size: 13 } },
        min: 0.61, max: 0.72,
        grid: { color: '#21262d' },
        ticks: { color: '#8b949e' }
      },
      y: {
        title: { display: true, text: '1 - LPIPS (content preservation)', color: '#c9d1d9', font: { size: 13 } },
        min: 0.50, max: 0.76,
        grid: { color: '#21262d' },
        ticks: { color: '#8b949e' }
      }
    },
    plugins: {
      legend: { labels: { color: '#c9d1d9', usePointStyle: true, pointStyle: 'circle' } },
      tooltip: {
        backgroundColor: '#161b22ee',
        titleColor: '#58a6ff',
        bodyColor: '#c9d1d9',
        borderColor: '#30363d',
        borderWidth: 1,
        callbacks: {
          title: (items) => items[0].raw.name,
          label: (item) => {
            const d = item.raw;
            return [
              `Method: ${d.method}`,
              `Epoch: ${d.epoch ?? 'N/A'}`,
              `CLIP Style: ${d.x.toFixed(4)}`,
              `1-LPIPS: ${d.y.toFixed(4)}`,
              `clip_Δ_idt: ${d.clip_s_delta_idt?.toFixed(4) ?? 'N/A'}`,
              `Eval: ${d.eval_type}`,
              d.notes ? `Notes: ${d.notes}` : ''
            ].filter(Boolean);
          }
        }
      }
    }
  },
  plugins: [idtFloorPlugin]
});

// Build summary table — top results per method on distinct5_512
const methods = ['LANCET/LBM', 'LANCET/620', 'SaMAM', 'SaMST', 'idt'];
const topByMethod = methods.map(m => {
  const rows = DATA.filter(d => d.method === m && d.dataset === 'distinct5_512');
  rows.sort((a, b) => b.clip_style - a.clip_style);
  return rows.slice(0, 3);
}).flat();

const tbody = document.querySelector('#summaryTable tbody');
let rank = 1;
topByMethod.forEach(d => {
  const isBest = d.name === '620_swd20_vlen0.04_b48_smoke' || d.name === 'wikiart512_ema_spectral_stat_full_adapt_e2_b48';
  const evalBadge = d.eval_type === 'formal' ? '<span class="badge badge-formal">formal</span>'
    : d.eval_type === 'smoke' ? '<span class="badge badge-smoke">smoke</span>' : '';
  const tr = document.createElement('tr');
  if (isBest) tr.classList.add('highlight');
  const methodClass = 'method-' + d.method.toLowerCase().replace(/[\/]/g, '');
  tr.innerHTML = `
    <td>${rank++}</td>
    <td class="${methodClass}">${d.method}</td>
    <td>${d.name}${isBest ? ' <span class="badge badge-best">BEST</span>' : ''}</td>
    <td>${d.dataset}</td>
    <td>${d.epoch ?? '-'}</td>
    <td>${d.clip_style.toFixed(4)}</td>
    <td>${d.one_minus_lpips != null ? d.one_minus_lpips.toFixed(4) : '-'}</td>
    <td>${d.clip_s_delta_idt != null ? d.clip_s_delta_idt.toFixed(4) : '-'}</td>
    <td>${evalBadge}</td>
    <td>${d.notes}</td>`;
  tbody.appendChild(tr);
});

// Add wikiart512 best as special row
const wikiBest = DATA.find(d => d.name === 'wikiart512_ema_spectral_stat_full_adapt_e2_b48');
if (wikiBest) {
  const tr = document.createElement('tr');
  tr.classList.add('highlight');
  tr.innerHTML = `
    <td>*</td>
    <td class="method-lancetlbm">LANCET/LBM</td>
    <td>${wikiBest.name} <span class="badge badge-best">BEST wikiart512</span></td>
    <td>${wikiBest.dataset}</td>
    <td>${wikiBest.epoch}</td>
    <td>${wikiBest.clip_style.toFixed(4)}</td>
    <td>-</td>
    <td>-</td>
    <td></td>
    <td>${wikiBest.notes}</td>`;
  tbody.appendChild(tr);
}
</script>
